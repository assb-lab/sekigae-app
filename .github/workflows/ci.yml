name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format / lint / typecheck
        run: pnpm exec vp check
      - name: i18n keys
        run: pnpm i18n:check
      - name: Unit tests
        run: pnpm exec vp test
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm bundle:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ブラウザ本体はキャッシュ。システム依存の apt が落ちていても警告で続行する（scripts/ci-install-playwright.sh）
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-chromium-
      - run: scripts/ci-install-playwright.sh chromium
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  cross-browser:
    # Firefox / WebKit での確認（失敗してもマージは止めない）
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ブラウザ本体はキャッシュ。システム依存の apt が落ちていても警告で続行する（scripts/ci-install-playwright.sh）
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-firefox-webkit-
      - run: scripts/ci-install-playwright.sh firefox webkit
      - run: pnpm build
      - run: PW_ALL_BROWSERS=1 pnpm exec playwright test --project=firefox --project=webkit
